        <p>For the soul there is neither birth<br>
        nor death at any time.<br>
        He has not come into being,<br>
        does not come into being,<br>
        and will not come into being.<br>
        He is unborn, eternal,<br>
        ever-existing and primeval.<br>
        He is not slain<br>
        when the body is&nbsp;slain.</p>
      </blockquote>
      <figcaption>
        <span class="author">Krishna</span>
        <cite>Bhagavad-gītā As It Is 2.20, trans. A.C. Bhaktivedanta Swami Prabhupāda</cite>
