      <blockquote>
        <p>A person is said to be established<br>
        in self-realization<br>
        and is called a yogī [or mystic]<br>
        when he is fully satisfied<br>
        by virtue of acquired knowledge and realization.<br>
        Such a person is situated in transcendence<br>
        and is self-controlled.<br>
        He sees everything –<br>
        whether it be pebbles, stones or gold –<br>
        as the&nbsp;same.</p>
      </blockquote>
      <figcaption>
        <span class="author">Krishna</span>
        <cite>Bhagavad-gītā As It Is 6.8, trans. A.C. Bhaktivedanta Swami Prabhupāda</cite>
