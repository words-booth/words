        <p>To be a creature means to be “nothing”<br>
        — that is to say, pure openness<br>
        and obedience in the presence<br>
        of the Creator.<br>
        And as the icon of Christ reveals,<br>
        in this nothingness,<br>
        in this ecstatic abandon,<br>
        the creature most fully discovers<br>
       &nbsp;herself.</p>
