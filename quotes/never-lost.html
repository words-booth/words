      <blockquote>
        <p>For one who sees Me everywhere<br>
        and sees everything in Me,<br>
        I am never lost,<br>
        nor is he ever lost to Me.<br>
        Such a yogī, who engages<br>
        in the worshipful service of the Supersoul,<br>
        knowing that I and the Supersoul are one,<br>
        remains always in Me<br>
        in all&nbsp;circumstances.</p>
      </blockquote>
      <figcaption>
        <span class="author">Krishna</span>
        <cite>Bhagavad-gītā As It Is 6.30–31, trans. A.C. Bhaktivedanta Swami Prabhupāda</cite>
