      <blockquote>
        <p>Whatever you do, whatever you eat,<br>
        whatever you offer or give away,<br>
        and whatever austerities you perform –<br>
        do that, O son of Kuntī,<br>
        as an offering to Me.<br>
        In this way you will be freed<br>
        from bondage to work<br>
        and its auspicious and inauspicious results.<br>
        With your mind fixed on Me<br>
        in this principle of renunciation,<br>
        you will be liberated and come to&nbsp;Me.</p>
      </blockquote>
      <figcaption>
        <span class="author">Krishna</span>
        <cite>Bhagavad-gītā As It Is 9.27–28, trans. A.C. Bhaktivedanta Swami Prabhupāda</cite>
